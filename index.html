<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운명의 서(書) : 비짓서울 마법 고서</title>
    <!-- 고서 느낌을 살리기 위한 구글 폰트 (고운 바탕체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1614;
            font-family: 'Gowun Batang', serif;
            color: #dcd0c0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(135deg, #2c211a 0%, #16110c 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #4a3728;
            position: relative;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            animation: fadeIn 1.5s ease-in-out;
        }

        .active {
            display: flex;
        }

        .title {
            font-size: 2.2rem;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        .touch-text {
            font-size: 1.2rem;
            margin-top: 50px;
            color: #a89f91;
            animation: pulse 2s infinite;
            cursor: pointer;
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #e6dec3;
        }

        .choice-btn {
            background-color: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            font-family: 'Gowun Batang', serif;
            font-size: 1.05rem;
            padding: 15px 20px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.2);
            text-align: left;
        }

        .choice-btn:hover, .choice-btn:active {
            background-color: #d4af37;
            color: #1a1614;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .loading-text {
            font-size: 1.3rem;
            color: #d4af37;
            animation: pulse 1s infinite;
        }

        .result-title {
            font-size: 1.8rem;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .result-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #c7bea9;
            max-height: 200px;
            overflow-y: auto;
        }

        .qr-code {
            width: 130px;
            height: 130px;
            background-color: white;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .reset-btn {
            margin-top: 20px;
            background: none;
            border: none;
            color: #888;
            font-family: 'Gowun Batang', serif;
            text-decoration: underline;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="book-container">
        
        <!-- 1. 랜딩 페이지 -->
        <div id="page-landing" class="page active" onclick="goToQuestion()">
            <div class="title">運 命 의  書 : SEOUL</div>
            <div style="font-size: 0.95rem; color: #888;">서울의 오래된 골목과 핫플레이스 사이, 당신을 위한 기록.</div>
            <div class="touch-text">화면을 터치하여 책장을 넘기세요</div>
        </div>

        <!-- 2. 질문 페이지 -->
        <div id="page-question" class="page">
            <div class="question-text">
                지친 여행자의 발걸음을 멈추게 할,<br>오늘 밤 당신의 운명을 바꿀 단 한 곳의 서울은<br>이미 정해져 있다.
            </div>
            <button class="choice-btn" onclick="makeChoice('alley')">
                [1] 고요한 역사와 온기가 숨쉬는 '서울의 오래된 골목'
            </button>
            <button class="choice-btn" onclick="makeChoice('hotplace')">
                [2] 트렌디한 감각이 부딪히는 '서울의 핫플레이스'
            </button>
        </div>

        <!-- 3. 로딩 페이지 -->
        <div id="page-loading" class="page">
            <div class="loading-text">비짓서울(Visit Seoul) API에서<br>운명의 장소를 탐색하고 있습니다...</div>
        </div>

        <!-- 4. 결과 페이지 -->
        <div id="page-result" class="page">
            <div id="result-title" class="result-title">장소 이름</div>
            <div id="result-desc" class="result-desc">API 데이터 기반 설명이 들어갑니다.</div>
            
            <div style="font-size: 0.85rem; color: #d4af37; margin-bottom: 8px;">이 고서가 준비한 길 안내 및 상생 혜택</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=VisitSeoulAI" alt="길 안내 QR" class="qr-code">
            <div style="font-size: 0.75rem; color: #888;">QR을 스캔하여 모바일 상세 길 안내를 받으세요</div>

            <button class="reset-btn" onclick="resetBook()">다시 책장 덮기 (초기화)</button>
        </div>

    </div>

    <script>
        // 여기에 비짓서울 API 키를 입력하세요[cite: 7]
        const API_KEY = "YOUR_VISIT_SEOUL_API_KEY_HERE"; 

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function goToQuestion() {
            showPage('page-question');
        }

        async function makeChoice(type) {
            showPage('page-loading');

            // [안내] 비짓서울 API 연동 지점
            // 실제 구현 시 아래 영역에서 fetch('비짓서울_API_URL?apiKey=' + API_KEY)를 호출하여 
            // 응답받은 서울 관광/맛집 데이터를 파싱하고 AI 알고리즘으로 필터링하게 됩니다[cite: 7].

            setTimeout(() => {
                let title = "";
                let desc = "";

                if (type === 'alley') {
                    title = "익선동 한옥거리 & 노포 초원식당";
                    desc = "빌딩 숲 사이에 숨겨진 100년의 시간 고스란히 담긴 골목.<br>비짓서울 API가 추천하는 고즈넉한 한옥 감성과 따뜻한 국물이 지친 여행자의 마음을 온전히 채워줍니다.";
                } else if (type === 'hotplace') {
                    title = "성수동 카페거리 & 연무장길";
                    desc = "가장 트렌디한 에너지가 폭발하는 서울의 성지.<br>붉은 벽돌 창고와 감각적인 쇼핑가가 어우러져 당신의 오감을 깨울 짜릿한 일탈을 선물합니다.";
                }

                document.getElementById('result-title').innerHTML = title;
                document.getElementById('result-desc').innerHTML = desc;

                showPage('page-result');
            }, 2000);
        }

        function resetBook() {
            showPage('page-landing');
        }
    </script>

</body>
</html>
